Update:
  update with sendmail:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
    data:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      smtpHost: null
      smtpPort: null
      smtpUsername: null
      smtpAuthType: null
      smtpSecurityType: null
    meta:
      testEmailStatus: 1
      applicationUrl: null

  update with application url:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: 'HTTPS://HRM.Test:8443/'
    data:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      smtpHost: null
      smtpPort: null
      smtpUsername: null
      smtpAuthType: null
      smtpSecurityType: null
    meta:
      testEmailStatus: 1
      applicationUrl: 'https://hrm.test:8443'

  update with application url containing path:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: 'http://hrm.test/path'
    invalidOnly: [ applicationUrl ]

  update with application url containing credentials:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: 'http://hrm.test@evil.test'
    invalidOnly: [ applicationUrl ]

  update with javascript application url:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: 'javascript:alert(1)'
    invalidOnly: [ applicationUrl ]

  update with markup in application url:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: 'http://hrm.test"><script>alert(1)</script>'
    invalidOnly: [ applicationUrl ]

  update with empty application url:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: ''
    invalidOnly: [ applicationUrl ]

  update with too long application url:
    userId: 1
    body:
      mailType: sendmail
      sentAs: 'test@orangehrm.com'
      applicationUrl: 'http://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.test'
    invalidOnly: [ applicationUrl ]

  update with smtp without host:
    userId: 1
    body:
      mailType: smtp
      sentAs: 'test@orangehrm.com'
    invalidOnly: [ smtpAuthType, smtpHost ]

  update smtp with login auth without username:
