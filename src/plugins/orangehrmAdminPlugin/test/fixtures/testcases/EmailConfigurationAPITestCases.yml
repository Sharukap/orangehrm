    data:
      mailType: smtp
      sentAs: 'test@orangehrm.com'
      smtpHost: 'smtp.orangehrm.com'
      smtpPort: null
      smtpUsername: null
      smtpAuthType: none
      smtpSecurityType: null
    meta:
      testEmailStatus: 1
      applicationUrl: null

